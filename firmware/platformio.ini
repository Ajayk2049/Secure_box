[env:test]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = bblanchon/ArduinoJson @ ^7.4.3
build_src_filter = +<circuit_test.cpp>

[env:main]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson @ ^7.4.3
build_src_filter = +<main.cpp> -<circuit_test.cpp>

[env:websocket_firmware]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson @ ^7.4.3
    links2004/WebSockets @ ^2.4.1
build_src_filter = +<websocket_firmware.cpp> -<main.cpp> -<circuit_test.cpp>